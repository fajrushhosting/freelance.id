<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FREELANCE ID</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #e2e8f0 100%);
            min-height: 100vh;
            padding: 24px 20px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 36px;
            padding: 20px 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.05);
        }

        .logo h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #1f2b3c, #2c3e5c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .saldo-card {
            background: #2c3e5c;
            padding: 8px 26px;
            border-radius: 60px;
            color: white;
            display: flex;
            gap: 20px;
            align-items: baseline;
            flex-wrap: wrap;
        }

        .saldo-nominal {
            font-size: 1.9rem;
            font-weight: 800;
        }

        .btn-tarik {
            background: #f5b042;
            border: none;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-tarik:hover {
            background: #ffa01e;
            transform: scale(0.96);
        }

        .tab-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: white;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            color: #2c3e5c;
        }

        .tab-btn.active {
            background: #2c3e5c;
            color: white;
        }

        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-top: 15px;
        }

        .job-card {
            background: white;
            border-radius: 28px;
            padding: 22px;
            border: 1px solid #eef2f7;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
        }

        .job-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .job-desc {
            color: #4a5568;
            margin: 12px 0;
        }

        .job-rate {
            background: #eef2ff;
            display: inline-block;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: bold;
            color: #2563eb;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.75rem;
            display: inline-block;
        }

        .badge-pending { background: #fef3c7; color: #b45309; }
        .badge-done { background: #dbeafe; color: #1e40af; }
        .badge-verified { background: #dcfce7; color: #15803d; }

        button {
            background: #2c3e5c;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            margin-right: 8px;
        }

        .admin-section {
            background: white;
            border-radius: 32px;
            padding: 26px;
        }

        .admin-job-item {
            border-bottom: 1px solid #e2e8f0;
            padding: 16px 0;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn-verify { background: #10b981; }
        .btn-delete { background: #ef4444; }

        input, textarea {
            padding: 10px 14px;
            border-radius: 28px;
            border: 1px solid #cbd5e1;
            width: 100%;
            margin-top: 6px;
            margin-bottom: 12px;
        }

        .form-custom {
            background: #f8fafc;
            border-radius: 24px;
            padding: 20px;
            margin-top: 20px;
        }

        .link-telegram {
            background: #eef2ff;
            border-radius: 30px;
            padding: 8px 15px;
            text-align: center;
            margin-top: 20px;
        }

        hr { margin: 20px 0; }

        @media (max-width: 680px) {
            .header { flex-direction: column; gap: 14px; text-align: center; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1>FREELANCE ID</h1></div>
        <div class="saldo-card">
            <span>💰 Saldo Anda :</span>
            <span class="saldo-nominal" id="userBalance">0</span>
            <button class="btn-tarik" id="withdrawBtn">💸 Tarik Saldo</button>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" data-tab="jobs-tab">📋 Daftar Job</button>
        <button class="tab-btn" data-tab="admin-tab">⚙️ Admin Panel</button>
    </div>

    <div id="jobs-tab" class="tab-content">
        <div class="jobs-grid" id="jobsContainer"></div>
        <div class="link-telegram">
            ⚠️ Butuh bantuan? Hubungi Admin: <strong><a href="https://t.me/msdimas33" target="_blank">t.me/msdimas33</a></strong><br>
            ✅ Setiap job diverifikasi admin ➕ saldo otomatis bertambah
        </div>
    </div>

    <div id="admin-tab" class="tab-content" style="display: none;">
        <div class="admin-section">
            <h2>🔐 Panel Admin (Kode Khusus)</h2>
            <div class="form-custom">
                <label>🔑 Kode Admin :</label>
                <input type="password" id="adminKeyInput" placeholder="Masukkan kode admin">
                <button id="authAdminBtn">Login sebagai Admin</button>
                <div id="adminPanelContent" style="display: none; margin-top: 20px;">
                    <h3>✅ Verifikasi Job (Selesai oleh User)</h3>
                    <div id="adminVerifList"></div>
                    <hr>
                    <h3>➕ Buat Job Custom</h3>
                    <input type="text" id="customJobTitle" placeholder="Nama Job">
                    <textarea id="customJobDesc" rows="2" placeholder="Deskripsi"></textarea>
                    <input type="number" id="customJobRate" placeholder="Rate (Rp)" value="20000">
                    <button id="createCustomJobBtn">✨ Tambah Job Baru</button>
                    <hr>
                    <h3>🗑️ Hapus Job (Semua Job)</h3>
                    <div id="allJobsListAdmin"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let jobs = [];
    let balance = 0;
    let nextJobId = 1;
    const ADMIN_SECRET_CODE = "FAJRUSH13-11-2007";
    let adminAuthenticated = false;

    function loadData() {
        const savedJobs = localStorage.getItem("freelance_jobs_final");
        const savedBalance = localStorage.getItem("freelance_balance_final");
        if (savedJobs) {
            jobs = JSON.parse(savedJobs);
            nextJobId = jobs.length > 0 ? Math.max(...jobs.map(j => j.id)) + 1 : 1;
        } else {
            jobs = [
                { id: 1, title: "Desain Logo Kreatif", desc: "Buat logo minimalis untuk brand kopi.", rate: 25000, status: "pending" },
                { id: 2, title: "Tulis Artikel 500 kata", desc: "Topik teknologi AI untuk blog.", rate: 40000, status: "pending" },
                { id: 3, title: "Edit Video Pendek", desc: "Edit video 30 detik untuk Instagram.", rate: 60000, status: "pending" }
            ];
            nextJobId = 4;
        }
        if (savedBalance) balance = parseInt(savedBalance) || 0;
        updateBalanceUI();
    }

    function saveData() {
        localStorage.setItem("freelance_jobs_final", JSON.stringify(jobs));
        localStorage.setItem("freelance_balance_final", balance);
    }

    function updateBalanceUI() {
        document.getElementById("userBalance").innerText = balance.toLocaleString('id-ID');
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderUserJobs() {
        const container = document.getElementById("jobsContainer");
        if (!container) return;
        container.innerHTML = "";
        jobs.forEach(job => {
            let statusBadge = "";
            let actionButton = "";
            if (job.status === "pending") {
                statusBadge = '<span class="badge badge-pending">⏳ Belum dikerjakan</span>';
                actionButton = `<button class="complete-btn" data-id="${job.id}">✔️ Tandai Selesai</button>`;
            } else if (job.status === "done") {
                statusBadge = '<span class="badge badge-done">✅ Selesai (menunggu verifikasi admin)</span>';
                actionButton = `<button disabled style="background:#94a3b8;">⏳ Menunggu Verifikasi</button>`;
            } else if (job.status === "verified") {
                statusBadge = '<span class="badge badge-verified">🏆 Terverifikasi + Saldo masuk</span>';
                actionButton = `<span>✅ Sudah diverifikasi</span>`;
            }
            const card = document.createElement("div");
            card.className = "job-card";
            card.innerHTML = `
                <div class="job-title">${escapeHtml(job.title)}</div>
                <div class="job-desc">${escapeHtml(job.desc)}</div>
                <div class="job-rate">💰 Rp ${job.rate.toLocaleString('id-ID')}</div>
                <div>${statusBadge}</div>
                ${actionButton}
            `;
            container.appendChild(card);
        });
        document.querySelectorAll('.complete-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const jobId = parseInt(btn.getAttribute('data-id'));
                completeJob(jobId);
            });
        });
    }

    function completeJob(jobId) {
        const job = jobs.find(j => j.id === jobId);
        if (!job || job.status !== "pending") {
            alert("Job tidak bisa diubah.");
            return;
        }
        job.status = "done";
        saveData();
        renderUserJobs();
        if (adminAuthenticated) {
            renderAdminVerifList();
            renderAllJobsForAdmin();
        }
        alert("✅ Job ditandai selesai! Tunggu admin verifikasi.");
    }

    function verifyJobByAdmin(jobId) {
        if (!adminAuthenticated) {
            alert("Akses ditolak! Login admin.");
            return false;
        }
        const job = jobs.find(j => j.id === jobId);
        if (!job || job.status !== "done") {
            alert("Job tidak dalam status selesai.");
            return false;
        }
        balance += job.rate;
        job.status = "verified";
        saveData();
        updateBalanceUI();
        renderUserJobs();
        renderAdminVerifList();
        renderAllJobsForAdmin();
        alert(`✅ Job "${job.title}" diverifikasi! + Rp ${job.rate.toLocaleString()}`);
        return true;
    }

    function deleteJob(jobId) {
        if (!adminAuthenticated) {
            alert("Akses ditolak!");
            return;
        }
        const jobIndex = jobs.findIndex(j => j.id === jobId);
        if (jobIndex === -1) return;
        const confirmHapus = confirm(`Hapus job "${jobs[jobIndex].title}"?`);
        if (confirmHapus) {
            jobs.splice(jobIndex, 1);
            saveData();
            renderUserJobs();
            renderAdminVerifList();
            renderAllJobsForAdmin();
            alert("Job dihapus.");
        }
    }

    function addCustomJob(title, desc, rate) {
        if (!adminAuthenticated) {
            alert("Login admin dulu.");
            return false;
        }
        if (!title || !desc || rate <= 0) {
            alert("Isi lengkap.");
            return false;
        }
        jobs.push({
            id: nextJobId++,
            title: title.trim(),
            desc: desc.trim(),
            rate: parseInt(rate),
            status: "pending"
        });
        saveData();
        renderUserJobs();
        renderAllJobsForAdmin();
        alert(`Job "${title}" ditambahkan.`);
        return true;
    }

    function renderAdminVerifList() {
        const container = document.getElementById("adminVerifList");
        if (!container) return;
        const doneJobs = jobs.filter(j => j.status === "done");
        if (doneJobs.length === 0) {
            container.innerHTML = "<p>✨ Tidak ada job menunggu verifikasi.</p>";
            return;
        }
        container.innerHTML = "";
        doneJobs.forEach(job => {
            const div = document.createElement("div");
            div.className = "admin-job-item";
            div.innerHTML = `
                <div class="flex-between">
                    <div><strong>${escapeHtml(job.title)}</strong> - Rp ${job.rate.toLocaleString()}</div>
                    <button class="verify-single-btn" data-id="${job.id}" style="background:#10b981;">✅ Verifikasi & Tambah Saldo</button>
                </div>
                <small>📝 ${escapeHtml(job.desc)} | Status: Selesai oleh user</small>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll('.verify-single-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const jobId = parseInt(btn.getAttribute('data-id'));
                verifyJobByAdmin(jobId);
            });
        });
    }

    function renderAllJobsForAdmin() {
        const container = document.getElementById("allJobsListAdmin");
        if (!container) return;
        if (jobs.length === 0) {
            container.innerHTML = "<p>Tidak ada job.</p>";
            return;
        }
        container.innerHTML = "";
        jobs.forEach(job => {
            let statusText = job.status === "pending" ? "⏳ Pending" : (job.status === "done" ? "✅ Selesai (menunggu verif)" : "🏆 Terverifikasi");
            const div = document.createElement("div");
            div.className = "admin-job-item";
            div.innerHTML = `
                <div class="flex-between">
                    <div><strong>${escapeHtml(job.title)}</strong> - Rp ${job.rate.toLocaleString()} <span style="font-size:12px;">(${statusText})</span></div>
                    <button class="delete-job-btn" data-id="${job.id}" style="background:#ef4444;">🗑️ Hapus Job</button>
                </div>
                <small>📝 ${escapeHtml(job.desc)}</small>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll('.delete-job-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const jobId = parseInt(btn.getAttribute('data-id'));
                deleteJob(jobId);
            });
        });
    }

    function requestWithdraw() {
        if (balance < 20000) {
            alert("Minimal tarik saldo adalah Rp 20.000. Saldo Anda: Rp " + balance.toLocaleString('id-ID'));
            return;
        }
        const amount = balance;
        const confirmMsg = confirm(`Tarik Rp ${amount.toLocaleString('id-ID')}? Saldo akan menjadi 0. Lanjutkan?`);
        if (!confirmMsg) return;

        const message = `Halo Admin, saya ingin menarik saldo sebesar Rp ${amount.toLocaleString('id-ID')}. Terima kasih.`;
        navigator.clipboard.writeText(message).then(() => {
            window.open("https://t.me/msdimas33", "_blank");
            alert(`✅ Permintaan tarik Rp ${amount.toLocaleString()} sudah disiapkan.\nPesan disalin ke clipboard.\nSilakan paste di chat admin (@msdimas33) yang terbuka.\nSaldo dikosongkan.`);
        }).catch(() => {
            window.open("https://t.me/msdimas33", "_blank");
            alert(`✅ Permintaan tarik Rp ${amount.toLocaleString()}\nKirim pesan: "${message}" ke admin.\nSaldo dikosongkan.`);
        });
        balance = 0;
        updateBalanceUI();
        saveData();
        renderUserJobs();
    }

    function loginAdmin() {
        const inputKey = document.getElementById("adminKeyInput").value;
        if (inputKey === ADMIN_SECRET_CODE) {
            adminAuthenticated = true;
            document.getElementById("adminPanelContent").style.display = "block";
            renderAdminVerifList();
            renderAllJobsForAdmin();
            alert("✅ Akses admin diberikan!");
        } else {
            alert("❌ Kode admin salah!");
            adminAuthenticated = false;
            document.getElementById("adminPanelContent").style.display = "none";
        }
    }

    function initTabs() {
        const tabs = document.querySelectorAll('.tab-btn');
        const contents = document.querySelectorAll('.tab-content');
        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.getAttribute('data-tab');
                contents.forEach(c => c.style.display = 'none');
                document.getElementById(targetId).style.display = 'block';
                tabs.forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                if (targetId === 'admin-tab') {
                    document.getElementById("adminPanelContent").style.display = "none";
                    adminAuthenticated = false;
                    document.getElementById("adminKeyInput").value = "";
                } else if (targetId === 'jobs-tab') {
                    renderUserJobs();
                }
            });
        });
    }

    document.getElementById("withdrawBtn").addEventListener("click", requestWithdraw);
    document.getElementById("authAdminBtn").addEventListener("click", loginAdmin);
    document.getElementById("createCustomJobBtn").addEventListener("click", () => {
        const title = document.getElementById("customJobTitle").value;
        const desc = document.getElementById("customJobDesc").value;
        const rate = document.getElementById("customJobRate").value;
        if (addCustomJob(title, desc, rate)) {
            document.getElementById("customJobTitle").value = "";
            document.getElementById("customJobDesc").value = "";
            document.getElementById("customJobRate").value = "20000";
        }
    });

    loadData();
    renderUserJobs();
    initTabs();
</script>
</body>
</html>
